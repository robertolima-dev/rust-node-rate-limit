name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Pull-request gate: format, lint and unit-test the Rust core.
  # ---------------------------------------------------------------------------
  lint:
    name: lint - rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # ---------------------------------------------------------------------------
  # Build the native addon for every supported target and upload as artifacts.
  # glibc/macOS/Windows targets build natively on their runner. The musl targets
  # (Alpine) build inside an Alpine container on the matching x64/arm64 runner.
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            # Cross-compile the Intel target on the arm64 runner (Xcode clang
            # supports this natively) to avoid the scarce macos-13 Intel queue.
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            alpine: true
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            alpine: true
    name: build - ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !matrix.alpine }}
        with:
          node-version: 20
      - name: Install Rust
        if: ${{ !matrix.alpine }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.alpine }}
        with:
          key: ${{ matrix.target }}
      - name: Install dependencies
        if: ${{ !matrix.alpine }}
        run: npm install
      - name: Build native addon
        if: ${{ !matrix.alpine }}
        run: npx napi build --platform --release --target ${{ matrix.target }} --js binding.js --dts binding.d.ts
      - name: Build native addon (musl, inside Alpine)
        if: ${{ matrix.alpine }}
        # musl links the C runtime statically by default, which rules out the
        # shared library a Node addon is; `-crt-static` links it dynamically.
        run: |
          docker run --rm -v "$PWD:/build" -w /build \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            node:20-alpine sh -euc '
              apk add --no-cache build-base curl
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              npm install
              npx napi build --platform --release --target ${{ matrix.target }} --js binding.js --dts binding.d.ts
            '
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build natively on each OS and run the JS test suite.
  # ---------------------------------------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    name: test - ${{ matrix.host }} - node ${{ matrix.node }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npm run build
      - run: npm test

  # ---------------------------------------------------------------------------
  # Bundle ALL platform binaries into the single main package, once. The smoke
  # jobs install exactly this tarball, and the publish job publishes it.
  # ---------------------------------------------------------------------------
  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Generate native loader/types and build JS layer
        # napi build (re)generates binding.js + binding.d.ts (the platform loader).
        run: |
          npx napi build --platform --release --js binding.js --dts binding.d.ts
          npm run build:js
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true
      - name: Bundle every platform binary into the package root
        run: |
          rm -f ./*.node
          cp artifacts/*.node .
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu \
                          linux-x64-musl linux-arm64-musl win32-x64-msvc; do
            test -f "rust-node-rate-limit.$platform.node" || { echo "missing binary: $platform"; exit 1; }
          done
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Install the packed tarball the way a user does, on every platform it ships
  # a binary for, and use the public API (CommonJS and ESM).
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke - ${{ matrix.platform }}
    needs: [pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            host: ubuntu-latest
          - platform: linux-arm64-gnu
            host: ubuntu-24.04-arm
          - platform: linux-x64-musl
            host: ubuntu-latest
            alpine: true
          - platform: linux-arm64-musl
            host: ubuntu-24.04-arm
            alpine: true
          - platform: darwin-arm64
            host: macos-latest
          - platform: darwin-x64
            host: macos-latest
            # x64 Node under Rosetta loads the darwin-x64 binary.
            node-arch: x64
          - platform: win32-x64-msvc
            host: windows-latest
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
      - uses: actions/setup-node@v4
        if: ${{ !matrix.alpine }}
        with:
          node-version: 20
          architecture: ${{ matrix.node-arch }}
      - name: Install and use the package
        if: ${{ !matrix.alpine }}
        shell: bash
        run: sh scripts/smoke-installed.sh ${{ matrix.platform }}
      - name: Install and use the package (Alpine)
        if: ${{ matrix.alpine }}
        run: >
          docker run --rm -v "$PWD:/work" -w /work node:20-alpine
          sh scripts/smoke-installed.sh ${{ matrix.platform }}

  # ---------------------------------------------------------------------------
  # On a version tag (vX.Y.Z): publish the tarball every smoke job installed.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [lint, build, test, pack, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Publish package
        # A tarball is published as-is: no lifecycle scripts run.
        run: npm publish ./rust-node-rate-limit-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
