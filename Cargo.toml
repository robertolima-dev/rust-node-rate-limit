[package]
name = "rust-node-rate-limit"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Ultra-fast rate limiting for Node.js powered by Rust"
repository = "https://github.com/robertolima-dev/rust-node-rate-limit"

[lib]
# cdylib => gera uma biblioteca dinâmica (.node) que o Node consegue carregar.
crate-type = ["cdylib"]

[dependencies]
# napi: runtime de bindings N-API (a ponte entre Rust e o motor V8/Node).
napi = { version = "2", default-features = false, features = ["napi4"] }
# napi-derive: macros (#[napi]) que geram o código de "cola" automaticamente.
napi-derive = "2"
# dashmap: HashMap concorrente com sharding interno (leituras quase lock-free).
dashmap = "6"
# thiserror: deriva erros idiomáticos (ex.: configuração inválida).
thiserror = "1"
# serde / serde_json: serialização — usados na futura integração ImmutableLog
# (eventos `rate_limit_blocked`). Mantidos no conjunto base de dependências.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# napi-build: roda no build.rs e configura flags de linkagem do N-API.
napi-build = "2"

[profile.release]
# Binário menor e mais rápido para distribuição.
lto = true
strip = "symbols"
opt-level = 3
